services:
  kiwix:
    image: ghcr.io/kiwix/kiwix-serve:latest
    restart: unless-stopped
    command: ["*.zim"]
    ports:
      - "127.0.0.1:8089:8080"
    volumes:
      - "${CACHE_DATA:-../offline-library}/kiwix:/data:ro"

  last-light:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:80"
    volumes:
      - "${CACHE_DATA:-../offline-library}/last-light/site:/usr/share/nginx/html:ro"

  survivor:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8092:80"
    volumes:
      - "${CACHE_DATA:-../offline-library}/survivor-library:/usr/share/nginx/html:ro"
      - "./nginx.conf:/etc/nginx/conf.d/default.conf:ro"
